[package]
name = "potoo-kalimat-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-kalimat-interpreter"
homepage = "https://diegopn.github.io/potoo-site/manual/kalimat/"
readme = "README.md"
description = "A host-driven interpreter for the documented historical Kalimat runtime."

[lib]
name = "potoo_kalimat_interpreter"
path = "src/lib.rs"

[[bin]]
name = "potoo-kalimat"
path = "src/bin/potoo-kalimat.rs"
